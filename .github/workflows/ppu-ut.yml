name: PPU UT
on:
  workflow_call:
    secrets:
      PPU_HOST_VOLUMES:
        required: false
      PPU_CPU_RUN_ROOT:
        required: false
      PPU_POD_RUN_ROOT:
        required: false
      PPU_CPU_ASSETS_ROOT:
        required: false
      PPU_POD_ASSETS_ROOT:
        required: false
      PPU_TOKENIZER_RECEIPTS_ROOT:
        required: false
    inputs:
      matrix:
        type: string
        required: true
      bundle_digest:
        type: string
        required: true
      target_sha:
        type: string
        required: true
      control_sha:
        type: string
        required: true
      control_digest:
        type: string
        required: true
      environment_digest:
        type: string
        required: true
      runtime_image_digest:
        type: string
        required: true
      base_image_digest:
        type: string
        required: true
      manual_pr:
        type: boolean
        default: false
      threshold_percent:
        type: string
        required: true
      scope:
        type: string
        required: true
permissions:
  contents: read
jobs:
  test:
    if: ${{ !inputs.manual_pr || github.run_attempt == 1 }}
    name: ${{ matrix.environment }} / ${{ matrix.bucket }}
    runs-on: k8s-runner-group-cpu-flytiger
    environment: ppu-ci
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: ${{ matrix.job_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.control_sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ppu-control-environment
          path: .ppu-control-export
      - name: Verify and restore trusted control interpreter
        run: >-
          bash control/.github/scripts/ppu_ci_container.sh restore-control
          --artifact .ppu-control-export --digest '${{ inputs.control_digest }}'
          --control-sha '${{ inputs.control_sha }}' --destination "$RUNNER_TEMP/ppu-control-runtime"
      - uses: actions/download-artifact@v4
        with:
          name: ppu-plan
          path: .ppu-ci
      - uses: actions/download-artifact@v4
        with:
          name: ppu-runtime-environment
          path: ${{ runner.temp }}/ppu-runtime-export
      - name: Verify execution image handoff before requesting PPU
        run: >-
          bash control/.github/scripts/ppu_ci_container.sh verify-image
          --artifact "$RUNNER_TEMP/ppu-runtime-export"
          --digest '${{ inputs.environment_digest }}'
          --control-sha '${{ inputs.control_sha }}' --target-sha '${{ inputs.target_sha }}'
          --image-digest '${{ inputs.runtime_image_digest }}'
          --base-image-digest '${{ inputs.base_image_digest }}' --check-only
      - name: Validate trusted runtime directories
        env:
          PPU_HOST_VOLUMES: ${{ secrets.PPU_HOST_VOLUMES }}
          PPU_CPU_RUN_ROOT: ${{ secrets.PPU_CPU_RUN_ROOT }}
          PPU_POD_RUN_ROOT: ${{ secrets.PPU_POD_RUN_ROOT }}
        run: python3 -I .ppu-ci/control/ppu_ci_paths.py run
      - name: Run PPU UT bucket
        id: ppu
        uses: flytiger-eco/shared-workflows/cluster-task@main
        with:
          image: ${{ inputs.runtime_image_digest }}
          nnodes: 0
          nproc_per_node: ${{ matrix.cards }}
          namespace: ${{ vars.PPU_NAMESPACE || 'ppu-sched' }}
          node_selector: "board-type=ZW-M890P"
          host_volumes: ${{ secrets.PPU_HOST_VOLUMES }}
          source_dir: /opt/megatron-lm
          artifact_paths: .ppu-ci
          timeout_minutes: ${{ matrix.action_minutes }}
          cleanup_policy: always
          dmesg_policy: on_failure
          container_options: |
            shm_size: "64Gi"
          extra_env: PPU_TARGET_SHA=${{ inputs.target_sha }},PPU_CONTROL_SHA=${{ inputs.control_sha }},PPU_SOURCE_ROOT=/opt/megatron-lm/source,PPU_CONTROL_DIR=/opt/megatron-lm/.ppu-ci/control,PPU_ARTIFACT_DIR=/opt/megatron-lm/.ppu-bundle,PPU_BUNDLE_DIR=${{ secrets.PPU_POD_RUN_ROOT }}/${{ github.run_id }}-${{ github.run_attempt }}/build,PPU_BUNDLE_DIGEST=${{ inputs.bundle_digest }},PPU_ENVIRONMENT_DIGEST=${{ inputs.environment_digest }},PPU_IMAGE_DIGEST=${{ inputs.runtime_image_digest }},PPU_BASE_IMAGE_DIGEST=${{ inputs.base_image_digest }},PPU_RESULTS_DIR=${{ secrets.PPU_POD_RUN_ROOT }}/${{ github.run_id }}-${{ github.run_attempt }}/unit/${{ matrix.id }}
          command: |
            set -euo pipefail
            cd /opt/megatron-lm
            [[ -d "$PPU_BUNDLE_DIR" ]]
            mkdir .ppu-bundle
            cp -a "$PPU_BUNDLE_DIR/." .ppu-bundle/
            python3 -I -B "$PPU_CONTROL_DIR/ppu_ci.py" verify-bundle \
              --output "$PPU_ARTIFACT_DIR" --plan .ppu-ci --bundle-digest "$PPU_BUNDLE_DIGEST"
            [[ "$(< "$PPU_ARTIFACT_DIR/commit.txt")" == "$PPU_TARGET_SHA" ]]
            [[ "$(< "$PPU_ARTIFACT_DIR/control.txt")" == "$PPU_CONTROL_SHA" ]]
            bash "$PPU_CONTROL_DIR/ppu_ci_container.sh" restore-source \
              --artifact "$PPU_ARTIFACT_DIR" --bundle-digest "$PPU_BUNDLE_DIGEST" --destination source
            bash "$PPU_CONTROL_DIR/ppu_ci_run.sh" '${{ matrix.id }}'
      - name: Export checked public evidence
        id: public-test-100
        if: ${{ always() && !cancelled() }}
        env:
          PPU_HOST_VOLUMES: ${{ secrets.PPU_HOST_VOLUMES }}
          PPU_CPU_RUN_ROOT: ${{ secrets.PPU_CPU_RUN_ROOT }}
          PPU_POD_RUN_ROOT: ${{ secrets.PPU_POD_RUN_ROOT }}
          EXPORT_SOURCE: ${{ secrets.PPU_CPU_RUN_ROOT }}/${{ github.run_id }}-${{ github.run_attempt }}/unit/${{ matrix.id }}/
        run: '"$RUNNER_TEMP/ppu-control-runtime/bin/python" -I .ppu-ci/control/ppu_ci_export.py --source "$EXPORT_SOURCE" --destination .ppu-public/test-100 --kind evidence'
      - name: Upload actual results, logs, and coverage for each rank
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.public-test-100.outcome == 'success' }}
        with:
          name: ppu-ut-${{ matrix.id }}
          path: .ppu-public/test-100/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Check execution completeness
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          PPU_STATUS: ${{ steps.ppu.outputs.job_status }}
          PPU_OUTCOME: ${{ steps.ppu.outcome }}
        run: '[[ "$PPU_OUTCOME" == success && "$PPU_STATUS" == succeeded ]]'
  result:
    name: UT Gate (${{ inputs.scope }} ${{ inputs.threshold_percent }}%)
    needs: test
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.control_sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ppu-control-environment
          path: .ppu-control-export
      - name: Verify and restore trusted control interpreter
        run: >-
          bash control/.github/scripts/ppu_ci_container.sh restore-control
          --artifact .ppu-control-export --digest '${{ inputs.control_digest }}'
          --control-sha '${{ inputs.control_sha }}' --destination "$RUNNER_TEMP/ppu-control-runtime"
      - uses: actions/download-artifact@v4
        with:
          name: ppu-plan
          path: .ppu-ci
      - uses: actions/download-artifact@v4
        with:
          pattern: ppu-ut-*
          path: results
      - name: Summarize scope, gate, and timing for the trusted trigger context
        env:
          PPU_MATRIX_RESULT: ${{ needs.test.result }}
        run: '"$RUNNER_TEMP/ppu-control-runtime/bin/python" -I .ppu-ci/control/ppu_ci.py summarize --results results'
      - name: Export checked public evidence
        id: public-result-132
        if: ${{ always() && !cancelled() }}
        env:
          EXPORT_SOURCE: results/summary.json
        run: '"$RUNNER_TEMP/ppu-control-runtime/bin/python" -I .ppu-ci/control/ppu_ci_export.py --source "$EXPORT_SOURCE" --destination .ppu-public/result-132 --kind evidence'
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.public-result-132.outcome == 'success' }}
        with:
          name: ppu-ut-summary
          path: .ppu-public/result-132/
          if-no-files-found: error
          retention-days: 7
