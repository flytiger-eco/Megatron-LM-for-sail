name: PPU Build
on:
  push:
    branches: [ci/ppu-validation]
  pull_request:
    branches: [ci/ppu-validation]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # merge_group:
  #   types: [checks_requested]
  # schedule:
  #   - cron: '0 2 * * *'
  # repository_dispatch:
  #   types: [ppu-ci]
  workflow_dispatch:
    inputs:
      build:
        description: 是否构建（关闭则同时跳过 UT）
        type: boolean
        default: true
      unit_test:
        description: 是否执行 UT
        type: boolean
        default: true
      repeat:
        description: 每个测试用例重复次数（0 表示跳过 UT）
        type: number
        default: 1
      timeout:
        description: 每个 bucket 全部重复及两个阶段的总分钟数
        type: number
        default: 30
permissions:
  contents: read
env:
  PIP_INDEX_URL: https://pkg.flytiger-eco.com/artifactory/api/pypi/pypi_index/simple
  PIP_CONFIG_FILE: /dev/null
  PIP_EXTRA_INDEX_URL: ''
  PIP_FIND_LINKS: ''
concurrency:
  group: ppu-build-${{ github.event_name == 'schedule' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  configure:
    if: >-
      vars.PPU_CI_ENABLED == 'true' &&
      (github.ref == 'refs/heads/ci/ppu-validation' ||
       (github.event_name == 'pull_request' && github.base_ref == 'ci/ppu-validation')) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.config.outputs.config }}
      build: ${{ steps.config.outputs.build }}
      unit_test: ${{ steps.config.outputs.unit_test }}
      unit_matrix: ${{ steps.config.outputs.unit_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install --index-url "$PIP_INDEX_URL" click pyyaml
      - id: config
        env:
          PPU_INPUTS: ${{ toJSON(inputs) }}
          PPU_DEFAULTS: >-
            {"build":"${{ vars.PPU_BUILD || 'yes' }}","unit_test":"${{ vars.PPU_UNIT_TEST || 'yes' }}",
            "repeat":"${{ vars.PPU_UNIT_TEST_REPEAT || '1' }}","timeout":"${{ vars.PPU_UNIT_TEST_TIMEOUT || '30' }}"}
        run: |
          python3 .github/scripts/ppu_ci.py configure
          cp .github/scripts/ppu_ci.py .ppu-ci/ppu_ci.py
      - uses: actions/upload-artifact@v4
        with:
          name: ppu-plan
          path: .ppu-ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  build:
    needs: configure
    if: needs.configure.outputs.build == 'true'
    runs-on: k8s-runner-group-cpu-flytiger
    environment: ppu-ci
    timeout-minutes: 210
    container:
      image: ghcr.io/actions/actions-runner:latest
    env:
      PPU_IMAGE: pkg.flytiger-eco.com/docker_release/pytorch:sdk2.2.0-2.13.0-ubuntu24.04-cuda13.0-py312-20261001
      MAX_JOBS: '16'
    steps:
      - name: 检出待测源码
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive
      - name: checkout 失败后等待
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: sleep 15
      - name: 重试检出待测源码（最后一次）
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: ppu-plan
          path: .ppu-ci
      - name: 在 890P 八卡 Pod 中构建 DEV/LTS 共用产物
        id: ppu-build
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          image: pkg.flytiger-eco.com/docker_release/pytorch:sdk2.2.0-2.13.0-ubuntu24.04-cuda13.0-py312-20261001
          nnodes: 0
          nproc_per_node: 8
          namespace: ${{ vars.PPU_NAMESPACE || 'ppu-sched' }}
          node_selector: "board-type=ZW-M890P"
          host_volumes: "/nas_aisw:/nas_aisw,/wl_nas:/mnt/wl_nas"
          source_dir: /opt/megatron-lm
          artifact_paths: .ppu-ci
          timeout_minutes: 180
          cleanup_policy: always
          dmesg_policy: on_failure
          container_options: |
            shm_size: "64Gi"
          extra_env: GITHUB_SHA=${{ github.sha }},PPU_BUNDLE_DIR=/mnt/wl_nas/devops/megatron-ci/${{ github.run_id }}-${{ github.run_attempt }}/build
          command: |
            set -euo pipefail
            umask 022
            cd /opt/megatron-lm
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends git ca-certificates wget
            chown -R "$(id -u):$(id -g)" .
            [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
            unset WORLD_SIZE RANK LOCAL_RANK
            bash .github/scripts/ppu_ci_build.sh
            mkdir -p "$PPU_BUNDLE_DIR"
            cp -R .ppu-ci/. "$PPU_BUNDLE_DIR/"
            chmod -R a+rX "$PPU_BUNDLE_DIR"
            printf '%s\n' "$GITHUB_SHA" > "$PPU_BUNDLE_DIR/.complete"
      - name: 检查 PPU 构建状态与回传产物
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          PPU_STATUS: ${{ steps.ppu-build.outputs.job_status }}
          PPU_OUTCOME: ${{ steps.ppu-build.outcome }}
          PPU_BUNDLE_DIR: /wl_nas/devops/megatron-ci/${{ github.run_id }}-${{ github.run_attempt }}/build
        run: |
          set -euo pipefail
          [[ "$PPU_OUTCOME" == success && "$PPU_STATUS" == succeeded ]] || exit 1
          [[ "$(< "$PPU_BUNDLE_DIR/.complete")" == "$GITHUB_SHA" ]] || exit 1
          [[ "$(< "$PPU_BUNDLE_DIR/commit.txt")" == "$GITHUB_SHA" ]] || exit 1
          [[ "$(< "$PPU_BUNDLE_DIR/image.txt")" == "$PPU_IMAGE" ]] || exit 1
          [[ -s "$PPU_BUNDLE_DIR/source.tar.gz" && -s "$PPU_BUNDLE_DIR/environment.tar.gz" ]] || exit 1
          cmp .ppu-ci/manifest.json "$PPU_BUNDLE_DIR/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ppu-bundle
          path: /wl_nas/devops/megatron-ci/${{ github.run_id }}-${{ github.run_attempt }}/build/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  unit-tests:
    needs: [configure, build]
    if: needs.configure.outputs.unit_test == 'true'
    uses: ./.github/workflows/ppu-ut.yml
    with:
      matrix: ${{ needs.configure.outputs.unit_matrix }}
