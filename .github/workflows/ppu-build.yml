name: PPU Build
on:
  push:
    branches: [ci/ppu-validation]
    tags: ['v*']
  pull_request_target:
    branches: [ci/ppu-validation]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, closed]
  merge_group:
    types: [checks_requested]
    branches: [ci/ppu-validation]
  workflow_dispatch:
    inputs:
      scope:
        description: auto follows the validated policy; full uses a 90% gate; candidate quick uses a 100% gate for non-PR manual validation
        type: choice
        options: [auto, quick, full]
        default: auto
      suite_family:
        description: NVIDIA DEV scope or release DEV/LTS scope (PRs always use NVIDIA DEV)
        type: choice
        options: [nvidia-dev, release-dev-lts]
        default: nvidia-dev
      unit_bucket:
        description: Exact bucket for non-PR manual DEV/full diagnostics only; leave empty to preserve the original scope
        type: string
        default: ''
      pr_number:
        description: Maintainer-authorized PR number (provide with full SHAs)
        type: string
        default: ''
      pr_sha:
        description: Reviewed full 40-character PR head SHA; new commits require reauthorization
        type: string
        default: ''
      pr_base_sha:
        description: Reviewed full 40-character target branch SHA (required for PR authorization)
        type: string
        default: ''
      build:
        description: Build artifacts (disabling also skips UT)
        type: boolean
        default: true
      unit_test:
        description: Run UT
        type: boolean
        default: true
      repeat:
        description: Full-suite repetitions (0 skips UT; quick always runs once)
        type: number
        default: 1
      timeout:
        description: Total minutes per full-suite bucket (quick uses fixed group budgets)
        type: number
        default: 30
permissions:
  contents: read
env:
  PIP_INDEX_URL: https://pkg.flytiger-eco.com/artifactory/api/pypi/pypi_index/simple
  PIP_CONFIG_FILE: /dev/null
  PIP_EXTRA_INDEX_URL: ''
  PIP_FIND_LINKS: ''
concurrency:
  group: ppu-validation-${{ (github.event_name == 'pull_request_target' && format('preflight-{0}', github.run_id)) || (github.event_name == 'workflow_dispatch' && (inputs.pr_number != '' || inputs.pr_sha != '' || inputs.pr_base_sha != '') && format('preflight-{0}', github.run_id)) || (startsWith(github.ref, 'refs/tags/v') && format('release-{0}', github.ref)) || (github.event_name == 'workflow_dispatch' && format('full-{0}', github.run_id)) || format('daily-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') || github.event_name == 'merge_group' }}
jobs:
  authorize:
    if: >-
      vars.PPU_CI_ENABLED == 'true' &&
      (github.ref == 'refs/heads/ci/ppu-validation' ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/ci/ppu-validation')) &&
      !(github.event_name == 'pull_request_target' && github.event.action == 'edited' && !github.event.changes.base)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}
      target_sha: ${{ steps.authorize.outputs.target_sha }}
      control_sha: ${{ steps.authorize.outputs.control_sha }}
      pr_number: ${{ steps.authorize.outputs.pr_number }}
      manual_pr: ${{ steps.authorize.outputs.manual_pr }}
      decision: ${{ steps.authorize.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.workflow_sha }}
          path: control
          persist-credentials: false
      - id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          PPU_INPUTS: ${{ toJSON(inputs) }}
          PPU_CONTROL_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.workflow_sha }}
          PPU_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          python3 -I control/.github/scripts/ppu_pr_authorize.py authorize
          mkdir -p .ppu-ci/control
          cp control/.github/scripts/ppu_pr_authorize.py .ppu-ci/control/
      - uses: actions/upload-artifact@v4
        with:
          name: ppu-authorization
          path: .ppu-ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  pr-pending:
    needs: authorize
    if: needs.authorize.outputs.pr_number != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    outputs:
      status_result: ${{ steps.status.outputs.status_result }}
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ppu-authorization
          path: .ppu-ci
      - id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .ppu-ci/control/ppu_pr_authorize.py status
  invalidate-base:
    needs: authorize
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/ppu-validation'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ppu-authorization
          path: .ppu-ci
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .ppu-ci/control/ppu_pr_authorize.py invalidate-base
  execute:
    needs: [authorize, pr-pending]
    if: >-
      always() && !cancelled() && needs.authorize.result == 'success' &&
      (needs.authorize.outputs.pr_number == '0' ||
       (needs.pr-pending.result == 'success' && needs.pr-pending.outputs.status_result == 'published'))
    concurrency:
      group: ppu-validation-execute-${{ needs.authorize.outputs.pr_number != '0' && format('pr-{0}', needs.authorize.outputs.pr_number) || format('run-{0}', github.run_id) }}
      cancel-in-progress: ${{ needs.authorize.outputs.pr_number != '0' }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/ppu-execute.yml
    with:
      allowed: ${{ needs.authorize.outputs.allowed == 'true' }}
      target_sha: ${{ needs.authorize.outputs.target_sha }}
      control_sha: ${{ needs.authorize.outputs.control_sha }}
      manual_pr: ${{ needs.authorize.outputs.manual_pr == 'true' }}
      request_inputs: ${{ toJSON(inputs) }}
  pr-result:
    needs: [authorize, pr-pending, execute]
    if: >-
      always() && needs.authorize.result == 'success' &&
      needs.authorize.outputs.allowed == 'true' && needs.authorize.outputs.pr_number != '0' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    steps:
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: ppu-authorization
          path: .ppu-ci
      - id: cancellation
        if: cancelled()
        run: echo 'cancelled=true' >> "$GITHUB_OUTPUT"
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANCELLED: ${{ steps.cancellation.outputs.cancelled == 'true' || needs.execute.result == 'cancelled' }}
          PENDING_RESULT: ${{ needs.pr-pending.result }}
          STATE: ${{ needs.pr-pending.result == 'success' && needs.execute.result == 'success' && needs.execute.outputs.execution_success == 'true' && 'success' || 'failure' }}
          DESCRIPTION: PPU ${{ needs.execute.outputs.scope }} check finished; gate ${{ needs.execute.outputs.threshold_percent }}%
        run: |
          if [[ "$CANCELLED" == true ]]; then
            python3 -I .ppu-ci/control/ppu_pr_authorize.py status --state error --cancelled --description 'PPU run cancelled; revalidate'
          elif [[ "$PENDING_RESULT" != success ]]; then
            python3 -I .ppu-ci/control/ppu_pr_authorize.py status --state error --description 'PPU status initialization failed; tests not started'
          else
            python3 -I .ppu-ci/control/ppu_pr_authorize.py status --state "$STATE" --description "$DESCRIPTION"
          fi
