name: PPU control tests
on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - '.github/scripts/ppu*'
      - '.github/scripts/tests/test_ppu*'
      - '.github/docker/**'
      - '.github/actions/ppu-build-cache/**'
      - '.github/workflows/ppu-*.yml'
      - '.github/workflows/copilot-upstream-sync*.yml'
      - '.github/ppu-*.json'
      - 'tests/test_utils/recipes/**'
      - 'tests/test_utils/python_scripts/recipe_parser.py'
      - 'tests/functional_tests/**'
permissions:
  contents: read
concurrency:
  group: ppu-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/docker/control-requirements.txt transformers==4.57.3 tokenizers==0.22.2 uv==0.13.0
      - run: python -m pytest -q -o addopts= .github/scripts/tests
  # Temporary CPU-only check of the installed system tools in the real SAIL base.
  runtime-tools:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/davidsophus/ppu-ci-thin-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve the actual immutable SAIL base
        id: identity
        run: >-
          python3 -I .github/scripts/ppu_ci_container.py fingerprint
          --control-root . --control-sha '${{ github.sha }}'
          --source-root . --target-sha '${{ github.sha }}'
      - name: Check system tools and SDK imports without PPU
        env:
          BASE_IMAGE: ${{ steps.identity.outputs.image_digest }}
        run: |
          mkdir "$RUNNER_TEMP/ppu-tools-context"
          cat > "$RUNNER_TEMP/ppu-tools-context/Dockerfile" <<'DOCKER'
          # syntax=docker/dockerfile:1.7
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          SHELL ["/bin/bash", "-euo", "pipefail", "-c"]
          RUN apt-get update && apt-get install -y --no-install-recommends git ca-certificates wget gettext-base make
          RUN --network=none <<'PROBE'
          /usr/bin/git --version
          /usr/bin/wget --version
          /usr/bin/envsubst --version
          /usr/bin/make --version
          /usr/bin/git init -q --bare /tmp/tool-probe.git
          /usr/bin/git clone -q file:///tmp/tool-probe.git /tmp/tool-checkout
          python3 -I - <<'PYTHON'
          import os, pathlib, ssl, subprocess
          import torch, triton
          assert '/opt/ppu-ci-venv/lib/ppu-system' not in os.environ.get('LD_LIBRARY_PATH', '')
          assert ssl.create_default_context().get_ca_certs()
          helper = pathlib.Path(subprocess.check_output(['/usr/bin/git', '--exec-path'], text=True).strip())
          assert (helper / 'git-remote-https').is_file()
          assert pathlib.Path('/etc/ssl/certs/ca-certificates.crt').stat().st_size > 0
          output = subprocess.check_output(['/usr/bin/envsubst'], input='$PPU_TOOL_PROBE', text=True, env={**os.environ, 'PPU_TOOL_PROBE': 'resolved'})
          assert output == 'resolved'
          print('SDK imports and system tools passed:', torch.__version__, triton.__version__)
          PYTHON
          PROBE
          DOCKER
          docker build --progress=plain --build-arg BASE_IMAGE="$BASE_IMAGE" --tag ppu-runtime-tools:cpu-check "$RUNNER_TEMP/ppu-tools-context"
