name: PPU control tests
on:
  push:
    branches: [davidsophus/ppu-ci-integration]
  pull_request:
    branches: [main, dev, davidsophus/ppu-ci-integration]
    paths: ['.github/**', 'tests/test_utils/**', 'tests/functional_tests/**']
permissions:
  contents: read
concurrency:
  group: ppu-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/docker/control-requirements.txt transformers==4.57.3 tokenizers==0.22.2
      - run: python -m pytest -q .github/scripts/tests
