name: PPU control tests
on:
  workflow_dispatch:
    inputs:
      diagnose:
        type: boolean
        default: false
  pull_request:
    branches: [main, dev]
    paths:
      - '.github/scripts/ppu*'
      - '.github/scripts/tests/test_ppu*'
      - '.github/docker/**'
      - '.github/actions/ppu-build-cache/**'
      - '.github/workflows/ppu-*.yml'
      - '.github/workflows/copilot-upstream-sync*.yml'
      - '.github/ppu-*.json'
      - 'tests/test_utils/recipes/**'
      - 'tests/test_utils/python_scripts/recipe_parser.py'
      - 'tests/functional_tests/**'
permissions:
  contents: read
concurrency:
  group: ppu-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: inputs.diagnose != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/docker/control-requirements.txt transformers==4.57.3 tokenizers==0.22.2 uv==0.13.0
      - run: python -m pytest -q -o addopts= .github/scripts/tests
  inspect-container-startup:
    if: inputs.diagnose == true && github.ref == 'refs/heads/davidsophus/ppu-ci-thin-adapter'
    runs-on: k8s-runner-group-cpu-flytiger
    timeout-minutes: 12
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Compare the existing main runner image and read failed Pod events
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, ssl, urllib.request
          from pathlib import Path
          print("Existing main runner image started successfully", flush=True)
          account = Path('/var/run/secrets/kubernetes.io/serviceaccount')
          if not (account / 'namespace').is_file():
              print('No in-cluster read-only API credentials mounted')
              raise SystemExit(0)
          namespace = (account / 'namespace').read_text().strip()
          pod = 'k8s-runner-group-cpu-flytiger-bjxrc-runner-lxfck-workflow'
          url = ('https://' + os.environ['KUBERNETES_SERVICE_HOST'] + ':'
                 + os.environ.get('KUBERNETES_SERVICE_PORT_HTTPS', '443')
                 + '/api/v1/namespaces/' + namespace
                 + '/events?fieldSelector=involvedObject.name%3D' + pod)
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + (account / 'token').read_text().strip()})
          try:
              with urllib.request.urlopen(request, context=ssl.create_default_context(
                      cafile=str(account / 'ca.crt')), timeout=20) as response:
                  events = json.load(response)['items']
              print(json.dumps([{k: e.get(k) for k in ('reason', 'message', 'count', 'lastTimestamp')}
                                for e in events]))
          except urllib.error.HTTPError as error:
              print('Pod events API returned HTTP', error.code)
          PY
