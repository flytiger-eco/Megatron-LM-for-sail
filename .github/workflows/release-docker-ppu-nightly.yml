name: Release Docker Images Nightly (PPU)

on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the built images to GitHub Packages (ghcr.io); disable for a build-only dry run'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '0 16 * * *'

concurrency:
  group: ${{ github.workflow }}-core_r0.19.0
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  SOURCE_BRANCH: core_r0.19.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: meta
        run: |
          set -euo pipefail
          owner_lc=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          date_tag=$(date -u +%Y%m%d)
          short_sha=$(git rev-parse --short=7 HEAD)
          branch=$(printf '%s' "$SOURCE_BRANCH" | sed 's|/|-|g; s/[^A-Za-z0-9._-]/-/g')
          echo "image=ghcr.io/${owner_lc}/megatron-lm-ppu-nightly" >> "$GITHUB_OUTPUT"
          echo "tag=${branch}-${date_tag}-cuda13.0.0-sdk2.2.0-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "rolling=nightly" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Packages
        if: ${{ inputs.push || github.event_name != 'workflow_dispatch' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ppu
          platforms: linux/amd64
          push: ${{ inputs.push || github.event_name != 'workflow_dispatch' }}
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.rolling }}
          build-args: |
            MEGATRON_REPO=${{ github.server_url }}/${{ github.repository }}.git
            MEGATRON_BRANCH=${{ env.SOURCE_BRANCH }}

      - name: Write image address to job summary
        run: |
          printf 'PPU image: `%s:%s` (rolling `%s:%s`)\n' \
            "${{ steps.meta.outputs.image }}" "${{ steps.meta.outputs.tag }}" \
            "${{ steps.meta.outputs.image }}" "${{ steps.meta.outputs.rolling }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
